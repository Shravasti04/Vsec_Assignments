
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Result Management System</h1>

    <div class="container">
        <h2>Enter Student Details</h2>

        <form id="studentForm">
            <label>Student Name:</label>
            <input type="text" id="name" required>

            <label>Roll Number:</label>
            <input type="text" id="roll" required>

            <label>Subject 1 Marks:</label>
            <input type="number" id="mark1" min="0" max="100" required>

            <label>Subject 2 Marks:</label>
            <input type="number" id="mark2" min="0" max="100" required>

            <label>Subject 3 Marks:</label>
            <input type="number" id="mark3" min="0" max="100" required>

            <button type="submit">Add Student</button>
        </form>
    </div>

    <div class="container">
        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Total</th>
                    <th>Percentage</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

        <h2 id="topper">Topper: Not available</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
