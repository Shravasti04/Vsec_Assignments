  <link rel="stylesheet" href="style.css">

</head>

<body>


  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg navbar-light bg-light">

    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">
        ✦ Aurelia
      </a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="rooms.html">Rooms</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="gallery.html">Gallery</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="contact.html">Contact</a>
          </li>

        </ul>

      </div>

    </div>

  </nav>


  <!-- CONTACT -->

  <section class="contact-page">

    <div class="container">

      <h1 class="text-center">
        Contact Us
      </h1>

      <p class="text-center mb-5">
        Plan your perfect stay at Aurelia Grand Resort.
      </p>


      <div class="row g-4">

        <!-- Contact Information -->

        <div class="col-md-5">

          <div class="contact-info">

            <h3>
              Get in Touch
            </h3>

            <p>
              <strong>Address:</strong><br>
              Green Valley Road, Maharashtra
            </p>

            <p>
              <strong>Phone:</strong><br>
              +91 98765 43210
            </p>

            <p>
              <strong>Email:</strong><br>
              hello@aurelia.com
            </p>

          </div>

        </div>


        <!-- Form -->

        <div class="col-md-7">

          <form class="contact-form">

            <label class="form-label">
              Name
            </label>

            <input type="text" class="form-control mb-3" placeholder="Enter your name">


            <label class="form-label">
              Email
            </label>

            <input type="email" class="form-control mb-3" placeholder="Enter your email">


            <label class="form-label">
              Message
            </label>

            <textarea class="form-control mb-3" rows="5" placeholder="Enter your message">
                    </textarea>


            <button class="btn btn-dark">
              Send Message
            </button>

          </form>

        </div>

      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer class="footer text-center">

    <p>
      © 2026 Aurelia Grand Resort
    </p>

  </footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
